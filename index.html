/* ---------- top bar ---------- */
#topbar{
  position:fixed; top:0; left:0; right:0; z-index:30;
  height:calc(52px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 16px 0;
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,.94); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
#topbar{gap:10px;}
.me-btn{display:flex; align-items:center; gap:9px; min-width:0;}
.avatar-sm{width:38px; height:38px; border-radius:50%; flex:none; background:var(--accent-soft); border:1.5px solid #ddd3f6; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.avatar-sm img{width:100%; height:100%; object-fit:cover; display:block;}
.me-txt{display:flex; flex-direction:column; align-items:flex-start; line-height:1.25; min-width:0;}
.me-txt b{font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px;}
.me-txt small{font-size:11.5px; color:var(--sub);}
#searchBtn{width:36px; height:36px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); font-size:16px; flex:none;}
#saveTip{
  font-size:12px; color:var(--ok); opacity:0; transition:opacity .3s;
  display:flex; align-items:center; gap:3px;
}
#saveTip.show{opacity:1;}

/* ---------- pages ---------- */
#pages{padding:calc(64px + env(safe-area-inset-top)) 14px 120px; max-width:520px; margin:0 auto;}
.page{display:none;}
.page.active{display:block; animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:.4; transform:translateY(4px);}to{opacity:1; transform:none;}}

/* ---------- date bar & calendar ---------- */
.datebar{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
.db-nav{
  width:34px; height:34px; border-radius:50%; background:var(--card);
  box-shadow:var(--shadow); font-size:20px; color:var(--sub); flex:none;
}
.db-date{
  flex:1; height:38px; border-radius:12px; background:var(--card); box-shadow:var(--shadow);
  font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:center; gap:6px;
}
.db-date .cal-ico{font-size:14px; opacity:.7;}
.calendar{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; margin-bottom:12px;}
.calendar,.row,.dep-card,.ychart,.legend,.cat-detail,.me-card,.me-group{border:1px solid var(--line);}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.cal-head b{font-size:15px;}
.cal-nav{width:32px; height:32px; border-radius:50%; background:var(--bg); font-size:18px; color:var(--sub);}
.cal-week{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--sub); margin-bottom:4px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); row-gap:2px;}
.cal-cell{
  position:relative; height:38px; display:flex; align-items:center; justify-content:center;
  font-size:14px; border-radius:10px;
}
.cal-cell.empty{pointer-events:none;}
.cal-cell.today{color:#9a7fe8; font-weight:700;}
.cal-cell.sel{background:var(--grad); color:#fff; font-weight:700;}
.cal-cell .dot{position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:#a78bfa;}
.cal-cell.sel .dot{background:#fff;}

/* ---------- summary card ---------- */
.sum-card{
  background:#fff; color:var(--ink); border:1px solid var(--line);
  border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow);
}
.sum-card .sum-label{font-size:12px; opacity:.9;}
.sum-card .sum-label{color:var(--sub); opacity:1;}
.sum-card .sum-amt{font-size:24px; font-weight:800; line-height:1.2;}
.sum-card .sum-amt,.sum-card .big-amt{
  background:var(--grad); -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
.sum-card .sum-side{text-align:right; font-size:12px; opacity:.92; line-height:1.7;}
.sum-card .sum-side{color:var(--sub); opacity:1;}
.sum-card .link-btn{
  display:inline-block; margin-top:2px; font-size:12px; color:#fff; opacity:.95;
  border-bottom:1px dashed rgba(255,255,255,.7);
}
.sum-card .link-btn{color:#8f76e8; opacity:1; border-bottom:1px dashed #cdbcf3;}

/* ---------- list rows ---------- */
.list{display:flex; flex-direction:column; gap:10px;}
.row{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:12px 14px; display:flex; align-items:center; gap:12px;
}
.row:active{transform:scale(.985);}
.thumb{width:52px; height:52px; border-radius:12px; object-fit:cover; flex:none; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:22px;}
.row-main{flex:1; min-width:0;}
.row-title{font-weight:600; font-size:15px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.row-sub{font-size:13px; color:var(--sub); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-cost{font-weight:700; font-size:16px; flex:none;}
.cat-chip{
  font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600;
}
.cdot{width:12px; height:12px; border-radius:4px; flex:none; box-shadow:inset 0 0 0 1px rgba(59,54,83,.08);}
.row-note{font-size:12px; color:var(--sub); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.badge-warn{font-size:11px; color:var(--warn); font-weight:600;}
.badge-done{font-size:11px; color:var(--ok); font-weight:600;}
.empty-box{text-align:center; color:var(--sub); padding:34px 18px 110px; font-size:14px;}
.empty-box .em{font-size:40px; display:block; margin-bottom:10px;}
.empty-box .dog-empty{width:min(230px, 58%); display:block; margin:0 auto 10px;}
.dog-foot{
  width:88px; display:block; margin:16px auto 0; cursor:pointer;
  animation:dogBob 3.2s ease-in-out infinite; opacity:.92;
}
@keyframes dogBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* ---------- deposit ---------- */
.dep-group-title{font-size:13px; font-weight:700; color:var(--sub); margin:18px 4px 8px; display:flex; align-items:center; gap:6px;}
.dep-group-title:first-child{margin-top:4px;}
.dep-group-title.warn{color:var(--warn);}
.dep-group-title.ok{color:var(--ok);}
.dep-card{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px 16px; margin-bottom:10px;
}
.dep-card.pending{border:1.5px solid #f0b9b4; background:#fdf5f4;}
.dep-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
.dep-bank{font-weight:700; font-size:16px; display:flex; align-items:center; gap:8px;}
.dep-type{font-size:11px; background:var(--accent-soft); color:var(--accent); padding:2px 8px; border-radius:20px; font-weight:600;}
.dep-amt{font-size:22px; font-weight:800; margin:2px 0 6px;}
.dep-meta{font-size:12.5px; color:var(--sub); line-height:1.8;}
.dep-meta b{color:var(--ink); font-weight:600;}
.dep-note{font-size:12px; color:var(--sub); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ---------- stats ---------- */
.mode-chips{display:flex; gap:8px; margin-bottom:14px;}
.mode-chip{
  flex:1; height:38px; border-radius:12px; background:var(--card); box-shadow:var(--shadow);
  font-size:14px; font-weight:600; color:var(--sub);
}
.mode-chip.on{background:var(--accent); color:#fff;}
.donut-wrap{display:flex; flex-direction:column; align-items:center; margin-bottom:14px;}
.donut{width:172px; height:172px; border-radius:50%; position:relative; display:flex; align-items:center; justify-content:center; margin:4px 0 12px;}
.donut::after{content:''; position:absolute; width:112px; height:112px; border-radius:50%; background:var(--bg);}
.donut-center{position:absolute; z-index:2; text-align:center; line-height:1.3;}
.donut-center small{display:block; font-size:11px; color:var(--sub);}
.donut-center b{font-size:17px; font-weight:800;}
.legend{width:100%; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:4px 14px;}
.legend-row{display:flex; align-items:center; gap:8px; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px; cursor:pointer;}
.legend-row:last-child{border-bottom:none;}
.legend-row:active{background:var(--accent-soft);}
.legend-row .sw{width:12px; height:12px; border-radius:4px; flex:none; box-shadow:inset 0 0 0 1px rgba(59,54,83,.08);}
.legend-row .ln{flex:1; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.legend-row .la{font-weight:700;}
.legend-row .lp{width:40px; text-align:right; color:var(--sub); font-size:12px; flex:none;}
.cat-detail{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:4px 14px; margin-bottom:14px;}
.cat-detail-title{font-size:12.5px; font-weight:700; color:var(--sub); padding:10px 0 2px;}
.cd-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; cursor:pointer;}
.cd-row:last-child{border-bottom:none;}
.cd-row .cd-date{color:var(--sub); font-size:12px; flex:none; width:64px;}
.cd-row .cd-desc{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cd-row .cd-amt{font-weight:700; flex:none;}
.stat-nav{display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:14px;}
.stat-nav b{font-size:17px;}
.stat-nav .db-nav{box-shadow:none; background:var(--card);}
.big-amt{font-size:36px; font-weight:800; margin:6px 0 2px;}
.big-sub{font-size:13px; color:var(--sub); margin-bottom:18px;}
.cat-row{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px;}
.cat-name{width:74px; flex:none; text-align:right; color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cat-bar{flex:1; height:12px; background:var(--line); border-radius:6px; overflow:hidden;}
.cat-bar i{display:block; height:100%; border-radius:6px; min-width:3px;}
.cat-amt{width:76px; flex:none; font-weight:700; font-size:12.5px;}
.cat-pct{width:38px; flex:none; color:var(--sub); font-size:12px; text-align:right;}
.ychart{display:flex; align-items:flex-end; gap:5px; height:170px; padding:10px 6px 0; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:10px;}
.ycol{flex:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; border-radius:8px;}
.ycol:active{background:var(--accent-soft);}
.ycol i{width:60%; max-width:22px; background:linear-gradient(180deg,#c9b4f8,#a78bfa); border-radius:5px 5px 2px 2px; min-height:3px;}
.ycol.max i{background:linear-gradient(180deg,#f7a8c9,#e58ab5);}
.ylab{font-size:10.5px; color:var(--sub);}
.yamt{font-size:10px; color:#9a7fe8; font-weight:700; transform:scale(.92);}

/* ---------- profile ---------- */
.me-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 16px; display:flex; align-items:center; gap:16px; margin-bottom:14px;}
.avatar-lg{width:68px; height:68px; border-radius:50%; object-fit:cover; flex:none; display:flex; align-items:center; justify-content:center; font-size:34px; background:var(--accent-soft); border:2px solid var(--line);}
.avatar-lg img{width:100%; height:100%; object-fit:cover; border-radius:50%; display:block;}
.avatar-lg .hint{font-size:11px; color:var(--sub);}
.nick-input{flex:1; border:none; border-bottom:1.5px dashed var(--line); background:transparent; font-size:19px; font-weight:700; padding:6px 2px; outline:none; min-width:0;}
.nick-input:focus{border-bottom-color:var(--accent);}
.me-group{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:6px 16px; margin-bottom:14px;}
.me-row{display:flex; align-items:center; justify-content:space-between; padding:14px 0; font-size:15px; border-bottom:1px solid var(--line);}
.me-row:last-child{border-bottom:none;}
.me-row .arr{color:var(--sub);}
.me-row.danger{color:var(--danger);}
.me-note{font-size:12px; color:var(--sub); line-height:1.8; padding:4px 6px 10px;}

/* ---------- FAB ---------- */
#fab{
  position:fixed; right:16px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:40;
  height:48px; padding:0 20px; border-radius:26px;
  background:var(--grad); color:#fff; font-size:15px; font-weight:700;
  display:flex; align-items:center; gap:6px;
  box-shadow:0 6px 18px rgba(167,139,250,.42);
  transition:transform .15s;
}
#fab:active{transform:scale(.94);}
#fab.hidden{display:none;}

/* ---------- tab bar ---------- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-btn{flex:1; height:60px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--sub); font-size:11px;}
.tab-btn .ico{font-size:21px; line-height:1;}
.tab-btn.on{color:var(--accent); font-weight:700;}

/* ---------- sheet ---------- */
#backdrop{position:fixed; inset:0; background:rgba(40,32,20,.42); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s;}
#backdrop.show{opacity:1; pointer-events:auto;}
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--bg); border-radius:22px 22px 0 0;
  max-height:90vh; overflow-y:auto; padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%); transition:transform .28s cubic-bezier(.3,.8,.3,1);
}
#sheet.open{transform:none;}
.sheet-grip{width:40px; height:4px; border-radius:2px; background:var(--line); margin:6px auto 12px;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.sheet-head b{font-size:18px;}
.sheet-x{width:32px; height:32px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); font-size:16px; color:var(--sub);}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; color:var(--sub); margin-bottom:6px; font-weight:600;}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px;
  background:var(--card); outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.field textarea{resize:none; height:74px;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:8px 16px; border-radius:22px; background:var(--card); border:1.5px solid var(--line);
  font-size:14px; font-weight:600; color:var(--sub);
}
.chip.on{background:linear-gradient(135deg,#b7a4f5,#f0a3c4); border-color:transparent; color:#fff;}
.money-wrap{position:relative;}
.money-wrap::before{content:'¥'; position:absolute; left:13px; top:50%; transform:translateY(-50%); font-weight:700; color:var(--sub);}
.money-wrap input{padding-left:30px !important; font-weight:700;}
.photo-box{
  border:1.5px dashed var(--line); border-radius:14px; background:var(--card);
  min-height:86px; display:flex; align-items:center; justify-content:center;
  color:var(--sub); font-size:14px; gap:8px; overflow:hidden; position:relative;
}
.photo-box img{width:100%; height:180px; object-fit:cover; display:block;}
.photo-box .pb-hint{padding:30px 0;}
.photo-del{
  position:absolute; top:8px; right:8px; width:28px; height:28px; border-radius:50%;
  background:rgba(0,0,0,.55); color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center;
}
.sheet-actions{display:flex; gap:10px; margin-top:18px;}
.btn{flex:1; height:46px; border-radius:14px; font-size:16px; font-weight:700;}
.btn-primary{background:var(--grad); color:#fff; box-shadow:0 4px 12px rgba(167,139,250,.35);}
.btn-ghost{background:var(--card); color:var(--sub); border:1.5px solid var(--line);}
.btn-danger{background:none; color:var(--danger); flex:0 0 auto; padding:0 16px; font-size:14px;}
.mini-note{font-size:12px; color:var(--sub); margin-top:6px;}

/* ---------- detail / chain ---------- */
.info-row{display:flex; justify-content:space-between; padding:11px 2px; font-size:14px; border-bottom:1px solid var(--line); gap:12px;}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--sub); flex:none;}
.info-row .v{font-weight:600; text-align:right; word-break:break-all;}
.chain{background:var(--card); border-radius:14px; padding:6px 14px; margin-bottom:8px;}
.chain-row{display:flex; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:13px; align-items:baseline;}
.chain-row:last-child{border-bottom:none;}
.chain-arrow{color:var(--accent); font-weight:800;}
.big-photo{width:100%; border-radius:14px; margin-bottom:6px; display:block;}

/* ---------- viewer ---------- */
#viewer{position:fixed; inset:0; z-index:90; background:rgba(10,8,5,.94); display:none;}
#viewer.show{display:block;}
#viewer .v-scroll{width:100%; height:100%; overflow:auto; touch-action:pinch-zoom; display:flex; align-items:center; justify-content:center;}
#viewer img{max-width:100%; display:block;}

/* ---------- toast & confirm ---------- */
#toast{
  position:fixed; left:50%; bottom:calc(110px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(16px);
  background:rgba(44,41,37,.92); color:#fff; font-size:13.5px; padding:9px 18px; border-radius:22px;
  opacity:0; pointer-events:none; transition:.25s; z-index:95; max-width:80vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#confirmBox{
  position:fixed; inset:0; z-index:96; display:none; align-items:center; justify-content:center; background:rgba(40,32,20,.45);
}
#confirmBox.show{display:flex;}
.cf-card{background:#fff; border-radius:18px; padding:22px 20px 16px; width:82%; max-width:320px; text-align:center;}
.cf-msg{font-size:15px; line-height:1.6; margin-bottom:18px; word-break:break-all;}
.cf-btns{display:flex; gap:10px;}
.cf-btns .btn{height:42px; font-size:15px;}
.cf-cancel{background:var(--bg); color:var(--sub);}
.cf-ok{background:var(--danger); color:#fff;}
.cf-ok.safe{background:var(--grad); box-shadow:0 3px 10px rgba(167,139,250,.3);}
</style>
</head>
<body>

<header id="topbar">
  <button class="me-btn" id="meBtn">
    <span class="avatar-sm" id="topAvatar"></span>
    <span class="me-txt"><b id="greetTxt">你好</b><small id="dateTxt"></small></span>
  </button>
  <span id="saveTip">已保存 ✓</span>
  <button id="searchBtn">🔍</button>
</header>

<main id="pages">
  <section class="page" id="page-diet"></section>
  <section class="page" id="page-exp"></section>
  <section class="page" id="page-stats"></section>
  <section class="page" id="page-dep"></section>
  <section class="page" id="page-me"></section>
</main>

<button id="fab"><span id="fabIco">＋</span><span id="fabText">记一餐</span></button>

<nav id="tabbar">
  <button class="tab-btn on" data-tab="diet"><span class="ico">🍜</span>饮食</button>
  <button class="tab-btn" data-tab="exp"><span class="ico">💰</span>记账</button>
  <button class="tab-btn" data-tab="stats"><span class="ico">📊</span>统计</button>
  <button class="tab-btn" data-tab="dep"><span class="ico">🏦</span>存款</button>
  <button class="tab-btn" data-tab="me"><span class="ico">👤</span>我的</button>
</nav>

<div id="backdrop"></div>
<div id="sheet"></div>
<div id="viewer"><div class="v-scroll"><img id="viewerImg" alt=""></div></div>
<div id="toast"></div>
<div id="confirmBox"><div class="cf-card"><div class="cf-msg" id="cfMsg"></div><div class="cf-btns"><button class="btn cf-cancel" id="cfCancel">取消</button><button class="btn cf-ok" id="cfOk">确定</button></div></div></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script>
'use strict';

function toISO(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return toISO(new Date()); }
function parseISO(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDaysISO(s, n){ const d = parseISO(s); d.setDate(d.getDate()+n); return toISO(d); }
function addMonthsISO(s, months){
  if(!s || !months) return '';
  const d = parseISO(s); const day = d.getDate();
  d.setMonth(d.getMonth() + months);
  if(d.getDate() !== day) d.setDate(0); // clamp to month end
  return toISO(d);
}
const WEEK = '日一二三四五六';
function fmtDateCN(s){ const d = parseISO(s); return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 · 周' + WEEK[d.getDay()]; }
function fmtMoney(n){
  if(n == null || n === '' || isNaN(+n)) return '¥0';
  let s = (+n).toFixed(2);
  s = s.replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
  return '¥' + s;
}
function shortMoney(n){
  n = +n || 0;
  if(n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + '万';
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(Math.round(n));
}
function hashStr(s){ let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
/* ---------- 分类配色 ----------
   每个分类固定一个淡色，彼此不重复；新建分类也会自动领到没人用过的颜色。
   颜色存在分类记录里，所以重开页面、导出/恢复备份都不会变。 */
const ACCENT = '#f286bd';                 // 「饮食」专用粉
const PALETTE = [
  '#e9aaaa', '#e9ab8b', '#e9d4aa', '#e9e98b', '#d4e9aa', '#abe98b', '#aae9aa',
  '#8be9ab', '#aae9d4', '#8be9e9', '#aad4e9', '#8babe9', '#aaaae9', '#ab8be9',
  '#d4aae9', '#e98be9', '#e9aad4', '#e98bab'
];
const CAT_RESERVED = new Set([ACCENT]);
let catColorList = [];
const catColorMap = new Map();
function hexRgb(hex){
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbHex(r,g,b){
  return '#' + [r,g,b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mixHex(a, b, t){
  const A = hexRgb(a), B = hexRgb(b);
  return rgbHex(A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t);
}
/* 两个颜色看起来差多少（加权 RGB 距离，越大越好区分） */
function colorDist(a, b){
  const A = hexRgb(a), B = hexRgb(b);
  const rm = (A[0] + B[0]) / 510;
  const dr = A[0] - B[0], dg = A[1] - B[1], db = A[2] - B[2];
  return Math.sqrt((2 + rm) * dr * dr + 4 * dg * dg + (3 - rm) * db * db);
}
/* 分类非常多、淡色用完时：同色相交替压深/提亮，不会出现两个一模一样的颜色 */
function shadeFor(idx, cycle){
  if(cycle <= 0) return PALETTE[idx];
  const step = 0.16 * Math.ceil(cycle / 2);
  return mixHex(PALETTE[idx], cycle % 2 ? '#4a4463' : '#ffffff', step);
}
const CAT_CANDIDATES = (() => {
  const out = [];
  for(let cycle = 0; cycle < 3; cycle++){
    PALETTE.forEach((_, i) => out.push({ color: shadeFor(i, cycle), cycle }));
  }
  return out;
})();
const CAT_CYCLE_PENALTY = 55;   // 优先用淡色，只有淡色真的挤不下时才用加深/提亮的
function catColorsInUse(){
  const s = new Set(CAT_RESERVED);
  catColorMap.forEach(v => s.add(v));
  return s;
}
/* 挑一个离所有已有颜色最远的颜色，保证每个分类看起来都不一样 */
function pickFreeColor(seed){
  const used = [...catColorsInUse()];
  const n = PALETTE.length;
  const start = ((seed % n) + n) % n;
  let best = null, bestScore = -Infinity;
  for(let k = 0; k < CAT_CANDIDATES.length; k++){
    const cand = CAT_CANDIDATES[(start + k) % CAT_CANDIDATES.length];
    if(used.indexOf(cand.color) >= 0) continue;
    let minD = Infinity;
    for(const u of used) minD = Math.min(minD, colorDist(cand.color, u));
    const score = minD - cand.cycle * CAT_CYCLE_PENALTY;
    if(score > bestScore){ bestScore = score; best = cand.color; }
  }
  return best || CAT_CANDIDATES[start].color;
}
function refreshCatColors(){
  catColorMap.clear();
  catColorList.forEach(c => { if(c && c.name && !isBadColor(c.color)) catColorMap.set(c.name, c.color); });
}
function catColor(name){
  const hit = catColorMap.get(name);
  if(hit) return hit;
  const col = name === '饮食' ? ACCENT : pickFreeColor(hashStr(name));
  catColorMap.set(name, col);
  return col;
}
/* 标签文字：同色相压深，淡色底上也读得清 */
function catInk(name){ return mixHex(catColor(name), '#3b3653', 0.45); }
/* 标签底色：同色相淡到很浅 */
function catTint(name){ return mixHex(catColor(name), '#ffffff', 0.72); }
/* 存量数据里万一存了坏颜色（纯黑/纯白/格式不对），当成没有颜色重新分配 */
function isBadColor(c){
  return !c || !/^#[0-9a-fA-F]{6}$/.test(c) || c.toLowerCase() === '#ffffff' || c.toLowerCase() === '#000000';
}
/* 新建分类：发一个还没人用过的颜色 */
function nextCatColor(name){
  const col = pickFreeColor(hashStr(name));
  catColorMap.set(name, col);
  return col;
}
/* 老数据里的分类没有颜色，这里补上并存起来 */
async function assignCategoryColors(){
  catColorList = state.categories;
  refreshCatColors();
  for(const c of catColorList){
    if(!isBadColor(c.color)) continue;
    const col = c.name === '饮食' ? ACCENT : pickFreeColor(hashStr(c.name));
    c.color = col;
    catColorMap.set(c.name, col);
    await dbPut('categories', c);
  }
}

/* ================= storage (IndexedDB, fallback localStorage) ================= */
const DB_NAME = 'lifebook-db', DB_VER = 1;
const STORES = ['meals','expenses','deposits','categories','kv'];
let idb = null;

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      STORES.forEach(s => { if(!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath:'id' }); });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbTx(store, mode, fn){
  return new Promise((res, rej) => {
    const tx = idb.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}
const lsKey = s => 'lifebook:' + s;
function lsAll(store){ try{ return JSON.parse(localStorage.getItem(lsKey(store)) || '[]'); }catch(e){ return []; } }
function lsSave(store, arr){ localStorage.setItem(lsKey(store), JSON.stringify(arr)); }

async function dbAll(store){
  if(idb){ try{ return await idbTx(store,'readonly', os => os.getAll()); }catch(e){ idb = null; } }
  return lsAll(store);
}
async function dbPut(store, rec){
  if(idb){ try{ await idbTx(store,'readwrite', os => os.put(rec)); return; }catch(e){ idb = null; } }
  const arr = lsAll(store); const i = arr.findIndex(x => x.id === rec.id);
  if(i >= 0) arr[i] = rec; else arr.push(rec);
  lsSave(store, arr);
}
async function dbDel(store, id){
  if(idb){ try{ await idbTx(store,'readwrite', os => os.delete(id)); return; }catch(e){ idb = null; } }
  lsSave(store, lsAll(store).filter(x => x.id !== id));
}
async function dbClear(store){
  if(idb){ try{ await idbTx(store,'readwrite', os => os.clear()); return; }catch(e){ idb = null; } }
  localStorage.removeItem(lsKey(store));
}

/* ================= real-time save ================= */
const pendingSaves = new Map();
let saveTimer = null;
let saveTipTimer = null;
function saveSoon(store, rec){
  pendingSaves.set(store + '|' + rec.id, { store, rec });
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSaves, 450);
}
async function flushSaves(){
  clearTimeout(saveTimer);
  if(!pendingSaves.size) return;
  const items = [...pendingSaves.values()];
  pendingSaves.clear();
  try{
    for(const it of items) await dbPut(it.store, it.rec);
    const tip = $('#saveTip');
    tip.classList.add('show');
    clearTimeout(saveTipTimer);
    saveTipTimer = setTimeout(() => tip.classList.remove('show'), 1400);
  }catch(e){ toast('保存失败，请重试'); }
}
window.addEventListener('pagehide', flushSaves);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') flushSaves(); });

async function removeRecord(store, id){
  pendingSaves.delete(store + '|' + id);
  const arr = state[store];
  const i = arr.findIndex(x => x.id === id);
  if(i >= 0) arr.splice(i, 1);
  await dbDel(store, id);
}

function compressImage(file, maxDim, q){
  maxDim = maxDim || 1280; q = q || 0.82;
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const sc = Math.min(1, maxDim / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', q));
      };
      img.onerror = rej;
      img.src = r.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function pickImage(cb, maxDim, q){
  const fp = $('#filePick');
  fp.value = '';
  fp.onchange = async () => {
    const f = fp.files && fp.files[0];
    if(f){ try{ cb(await compressImage(f, maxDim, q)); }catch(e){ toast('图片读取失败'); } }
  };
  fp.click();
}

/* ================= calendar ================= */
function calHTML(st, sel, dots){
  const first = new Date(st.y, st.m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(st.y, st.m + 1, 0).getDate();
  let cells = '';
  for(let i = 0; i < startDow; i++) cells += '<div class="cal-cell empty"></div>';
  for(let d = 1; d <= daysInMonth; d++){
    const ds = toISO(new Date(st.y, st.m, d));
    const cls = ['cal-cell'];
    if(ds === sel) cls.push('sel');
    else if(ds === todayStr()) cls.push('today');
    cells += '<div class="' + cls.join(' ') + '" data-date="' + ds + '">' + d + (dots.has(ds) ? '<i class="dot"></i>' : '') + '</div>';
  }
  return '<div class="calendar">'
    + '<div class="cal-head"><button class="cal-nav" data-nav="-1">‹</button><b>' + st.y + '年' + (st.m+1) + '月</b><button class="cal-nav" data-nav="1">›</button></div>'
    + '<div class="cal-week">' + WEEK.split('').map(w => '<span>' + w + '</span>').join('') + '</div>'
    + '<div class="cal-grid">' + cells + '</div></div>';
}
function bindCal(root, page, rerender){
  root.querySelectorAll('.cal-nav').forEach(b => b.onclick = () => {
    page.st.m += +b.dataset.nav;
    if(page.st.m < 0){ page.st.m = 11; page.st.y--; }
    if(page.st.m > 11){ page.st.m = 0; page.st.y++; }
    rerender();
  });
  root.querySelectorAll('.cal-cell[data-date]').forEach(c => c.onclick = () => {
    page.date = c.dataset.date;
    page.st = { y: parseISO(page.date).getFullYear(), m: parseISO(page.date).getMonth() };
    rerender();
  });
}
function dateBarHTML(page){
  return '<div class="datebar">'
    + '<button class="db-nav" data-nav="-1">‹</button>'
    + '<button class="db-date" data-cal>' + fmtDateCN(page.date) + '<span class="cal-ico">📅</span></button>'
    + '<button class="db-nav" data-nav="1">›</button></div>';
}
function bindDateBar(root, page, rerender){
  root.querySelectorAll('.db-nav').forEach(b => b.onclick = () => {
    page.date = addDaysISO(page.date, +b.dataset.nav);
    page.st = { y: parseISO(page.date).getFullYear(), m: parseISO(page.date).getMonth() };
    rerender();
  });

  if(calBtn) calBtn.onclick = () => {
    page.cal = !page.cal;
    if(page.cal) page.st = { y: parseISO(page.date).getFullYear(), m: parseISO(page.date).getMonth() };

    + '<div class="chain">' + rows + '</div>'
    + '<div class="mini-note">默认分类不可删除；删除分类不会删除已记录的账目。</div>'
  );
  $$('#sheet [data-x]').forEach(b => b.onclick = closeSheet);
  const add = async () => {
    const name = $('#cmNew').value.trim();
    if(!name) return;
    if(state.categories.some(c => c.name === name)){ toast('分类已存在'); return; }
    const c = { id: uid(), name, custom:true, color: nextCatColor(name) };
    state.categories.push(c);
    await dbPut('categories', c);
    openCatManager(); toast('已添加「' + name + '」');
  };
  $('#cmAdd').onclick = add;
  $('#cmNew').addEventListener('keydown', ev => { if(ev.key === 'Enter') add(); });
  $$('#sheet [data-delcat]').forEach(b => b.onclick = async () => {
    if(await confirmDlg('确定删除分类「' + b.dataset.delcat + '」吗？', '删除')){
      const c = state.categories.find(x => x.name === b.dataset.delcat);
      if(c) await removeRecord('categories', c.id);
      openCatManager();
    }
  });
}

/* ================= stats page ================= */
function monthCatTotals(mKey){
  const map = {};
  state.expenses.forEach(e => { if(e.date.startsWith(mKey)) map[e.category] = (map[e.category] || 0) + (+e.cost || 0); });
  state.meals.forEach(m => { if(m.date.startsWith(mKey)) map['饮食'] = (map['饮食'] || 0) + (+m.cost || 0); });
  return map;
}
function renderStats(){
  const el = $('#page-stats');
  const s = ui.stats;
  let body = '';
  if(s.mode === 'month'){
    const mKey = s.y + '-' + String(s.m + 1).padStart(2, '0');
    const map = monthCatTotals(mKey);
    const entries = Object.entries(map).sort((a,b) => b[1] - a[1]);
    const total = entries.reduce((x, kv) => x + kv[1], 0);
    let acc = 0;
    const segs = [];
    entries.forEach((kv, i) => {
      const start = acc;
      acc += total ? kv[1] / total * 360 : 0;
      // 相邻色块之间留一条细缝，淡色挨在一起也分得清
      const gap = (acc - start) > 3 && i < entries.length - 1 ? 0.7 : 0;
      segs.push(catColor(kv[0]) + ' ' + (start ? (start + gap).toFixed(2) : '0') + 'deg ' + (acc - gap).toFixed(2) + 'deg');
      if(gap) segs.push('var(--bg) ' + (acc - gap).toFixed(2) + 'deg ' + (acc + gap).toFixed(2) + 'deg');
    });
    const donutCss = entries.length ? 'background:conic-gradient(' + segs.join(',') + ')' : 'background:var(--line)';
    const legendRows = entries.map(kv => {
      const pct = total ? Math.round(kv[1] / total * 100) : 0;
      return '<div class="legend-row" data-cat="' + esc(kv[0]) + '">'
        + '<span class="sw" style="background:' + catColor(kv[0]) + '"></span>'
        + '<span class="ln">' + esc(kv[0]) + '</span>'
        + '<span class="la">' + fmtMoney(kv[1]) + '</span><span class="lp">' + pct + '%</span></div>';
    }).join('');
    body =
      '<div class="stat-nav"><button class="db-nav" data-nav="-1">‹</button><b>' + s.y + '年' + (s.m + 1) + '月</b><button class="db-nav" data-nav="1">›</button></div>'
      + '<div class="donut-wrap">'
        + '<div class="donut" style="' + donutCss + '"><div class="donut-center"><small>本月总支出</small><b>' + fmtMoney(total) + '</b></div></div>'
        + (entries.length ? '<div class="legend">' + legendRows + '</div><div class="mini-note">点击分类可查看明细 ↓</div>' : '')
      + '</div>'
      + '<div id="catDetail"></div>'
      + (entries.length ? '' : emptyHTML('', '趴着等数据中…<br>这个月还没有记录', 'lying'));
    body += dogFootHTML('lying');
  }else{
    const vals = [];
    for(let i = 0; i < 12; i++){
      const mKey = s.y + '-' + String(i + 1).padStart(2, '0');
      const map = monthCatTotals(mKey);
      vals.push(Object.values(map).reduce((a,b) => a + b, 0));
    }
    const total = vals.reduce((a,b) => a + b, 0);
    const max = Math.max(...vals, 1);
    const maxI = vals.indexOf(Math.max(...vals));
    const cols = vals.map((v, i) =>
      '<div class="ycol' + (i === maxI && v > 0 ? ' max' : '') + '" data-m="' + i + '">'
      + (v > 0 ? '<span class="yamt">' + shortMoney(v) + '</span>' : '')
      + '<i style="height:' + Math.max(2, Math.round(v / max * 78)) + '%"></i>'
      + '<span class="ylab">' + (i + 1) + '</span></div>').join('');
    const best = vals[maxI] > 0 ? '花得最多的月份：<b>' + (maxI + 1) + '月（' + fmtMoney(vals[maxI]) + '）</b>' : '这一年还没有记录';
    body =
      '<div class="stat-nav"><button class="db-nav" data-nav="-1">‹</button><b>' + s.y + '年</b><button class="db-nav" data-nav="1">›</button></div>'
      + '<div class="sum-card" style="display:block;"><div class="sum-label">' + s.y + '年总支出</div><div class="big-amt">' + fmtMoney(total) + '</div></div>'
      + '<div class="ychart">' + cols + '</div>'
      + '<div class="mini-note" style="text-align:center;">' + best + ' · 点击柱子可查看对应月份</div>';
    body += dogFootHTML('sit');
  }
  el.innerHTML =
    '<div class="mode-chips">'
    + '<button class="mode-chip' + (s.mode === 'month' ? ' on' : '') + '" data-mode="month">月统计</button>'
    + '<button class="mode-chip' + (s.mode === 'year' ? ' on' : '') + '" data-mode="year">年对比</button></div>'
    + body;
  $$('#page-stats .mode-chip').forEach(b => b.onclick = () => { s.mode = b.dataset.mode; renderStats(); });
  $$('#page-stats .stat-nav .db-nav').forEach(b => b.onclick = () => {
    if(s.mode === 'month'){
      s.m += +b.dataset.nav;
      if(s.m < 0){ s.m = 11; s.y--; }
      if(s.m > 11){ s.m = 0; s.y++; }
    }else{
      s.y += +b.dataset.nav;
    }
    renderStats();
  });
  $$('#page-stats .ycol').forEach(c => c.onclick = () => { s.mode = 'month'; s.m = +c.dataset.m; renderStats(); });
  $$('#page-stats .legend-row').forEach(r => r.onclick = () => {
    const mKey = s.y + '-' + String(s.m + 1).padStart(2, '0');
    renderCatDetail(mKey, r.dataset.cat);
  });
  bindDogFoot(el);
}
function monthCatEntries(mKey, cat){
  const items = [];
  state.expenses.forEach(e => { if(e.date.startsWith(mKey) && e.category === cat) items.push({ kind:'exp', id:e.id, date:e.date, desc:e.desc, note:e.note, cost:e.cost }); });
  if(cat === '饮食') state.meals.forEach(m => { if(m.date.startsWith(mKey)) items.push({ kind:'meal', id:m.id, date:m.date, desc:m.desc, mealType:m.mealType, note:m.note, cost:m.cost }); });
  return items.sort((a,b) => b.date.localeCompare(a.date));
}
function renderCatDetail(mKey, cat){
  const box = $('#catDetail');
  if(!box) return;
  if(box.dataset.cat === cat){ box.innerHTML = ''; delete box.dataset.cat; return; }
  box.dataset.cat = cat;
  const items = monthCatEntries(mKey, cat);
  box.innerHTML = '<div class="cat-detail"><div class="cat-detail-title">' + esc(cat) + ' · 本月明细（' + items.length + ' 笔）</div>'
    + (items.map(it =>
      '<div class="cd-row" data-kind="' + it.kind + '" data-id="' + it.id + '">'
      + '<span class="cd-date">' + it.date.slice(5).replace('-', '/') + '</span>'
      + '<span class="cd-desc">' + (esc(it.desc) || esc(it.mealType || '未填写')) + (it.note ? ' <span style="color:var(--sub);font-size:11.5px">📝' + esc(it.note) + '</span>' : '') + '</span>'
      + '<span class="cd-amt">' + fmtMoney(it.cost) + '</span></div>').join('')
    || '<div class="cd-row"><span class="cd-desc" style="color:var(--sub)">暂无明细</span></div>')
    + '</div>';
  box.querySelectorAll('.cd-row[data-id]').forEach(r => r.onclick = () => {
    if(r.dataset.kind === 'meal'){ const m = state.meals.find(x => x.id === r.dataset.id); if(m) openMealEditor(m); }
    else { const e2 = state.expenses.find(x => x.id === r.dataset.id); if(e2) openExpEditor(e2); }
  });
}

/* ================= deposits page ================= */
function depStatus(d){
  if(d.completed) return 'done';
  if(d.type === '定期' && d.maturityDate && d.maturityDate <= todayStr()) return 'pending';
  return 'holding';
}
const DEP_STATUS_TXT = { holding:'持有中', pending:'⚠️ 到期未操作', done:'✓ 已完成' };
function maskCard(c){ if(!c) return '未填写'; return c.length <= 8 ? c : c.slice(0, 4) + ' •••••• ' + c.slice(-4); }
function normalizeDep(d){
  if(d.termValue == null){
    d.termValue = (d.termMonths != null) ? d.termMonths : 12;
    d.termUnit = 'm';
  }
  if(!d.termUnit) d.termUnit = 'm';
}
function normalizeAllDeps(){
  state.deposits.forEach(normalizeDep);
}
function maturityFrom(d, dateStr){
  normalizeDep(d);
  if(d.termUnit === 'd') return addDaysISO(dateStr, d.termValue);
  return addMonthsISO(dateStr, d.termUnit === 'y' ? d.termValue * 12 : d.termValue);
}
function termLabel(d){
  if(d.type !== '定期') return '活期';
  normalizeDep(d);
  if(d.termUnit === 'd') return '定期 · ' + d.termValue + '天';
  if(d.termUnit === 'y') return '定期 · ' + d.termValue + '年';
  const t = TERMS.find(x => x.m === d.termValue);
  return '定期 · ' + (t ? t.label : (d.termValue + '个月'));
}

function renderDep(){
  const el = $('#page-dep');
  const g = { pending:[], holding:[], done:[] };
  state.deposits.forEach(d => g[depStatus(d)].push(d));
  const byDate = (a,b) => (b.depositDate || '').localeCompare(a.depositDate || '');
  g.pending.sort(byDate); g.holding.sort(byDate);
  g.done.sort((a,b) => (b.actualOutDate || '').localeCompare(a.actualOutDate || ''));
  const card = d => {
    const st = depStatus(d);
    const badge = st === 'pending' ? '<span class="badge-warn">⚠️ 待处理</span>'
      : st === 'done' ? '<span class="badge-done">✓ 已完成</span>'
      : '<span style="font-size:11px;color:var(--ok)">● 持有中</span>';
    return '<div class="dep-card' + (st === 'pending' ? ' pending' : '') + '" data-id="' + d.id + '">'
      + '<div class="dep-top"><div class="dep-bank">🏦 ' + esc(d.bank) + '<span class="dep-type">' + termLabel(d) + '</span></div>' + badge + '</div>'
      + '<div class="dep-amt">' + fmtMoney(d.amount) + '</div>'
      + '<div class="dep-meta">存入 <b>' + (d.depositDate || '—') + '</b>'
      + (d.type === '定期' ? ' · 到期 <b>' + (d.maturityDate || '—') + '</b>' : '')
      + (st === 'done' ? ' · 已取出 <b>' + (d.actualOutDate || '—') + '</b>' : '')
      + '<br>卡号 ' + maskCard(d.card) + '</div>'
      + (d.note ? '<div class="dep-note">📝 ' + esc(d.note) + '</div>' : '')
      + '</div>';
  };
  let html = '';
  if(g.pending.length) html += '<div class="dep-group-title warn">⚠️ 到期未操作（' + g.pending.length + '）</div>' + g.pending.map(card).join('');
  if(g.holding.length) html += '<div class="dep-group-title">💼 持有中（' + g.holding.length + '）</div>' + g.holding.map(card).join('');
  if(g.done.length) html += '<div class="dep-group-title ok">✓ 已完成（' + g.done.length + '）</div>' + g.done.map(card).join('');
  el.innerHTML = html
    + (html ? dogFootHTML('lying') : '')
    || emptyHTML('', '存钱罐还在打盹…<br>点右下角「新建存单」开始吧', 'sleep');
  bindDogFoot(el);
  el.querySelectorAll('.dep-card').forEach(c => c.onclick = () => {
    const d = state.deposits.find(x => x.id === c.dataset.id);
    if(d) openDepDetail(d);
  });
}

function chainOf(d){
  const arr = [d];
  let cur = d;
  const guard = new Set([d.id]);
  while(cur.parentId && !guard.has(cur.parentId)){
    cur = state.deposits.find(x => x.id === cur.parentId);
    if(!cur) break;
    guard.add(cur.id);
    arr.push(cur);
  }
  return arr.reverse();
}
function openDepDetail(d){
  const st = depStatus(d);
  const chain = chainOf(d);
  const chainHTML = chain.length > 1
    ? '<div class="chain">' + chain.map((c, i) =>
        '<div class="chain-row"><span class="chain-arrow">' + (i === 0 ? '起点' : '↑ 转存') + '</span>'
        + '<span>' + esc(c.bank) + ' · ' + fmtMoney(c.amount) + '<br><span style="color:var(--sub)">'
        + (c.depositDate || '') + (c.type === '定期' ? ' → ' + (c.maturityDate || '') : ' · 活期')
        + (depStatus(c) === 'done' ? ' · 已完成' : '') + '</span></span></div>').join('') + '</div>'
    : '';
  let actions = '';
  if(st === 'pending'){
    actions = '<div class="sheet-actions" style="flex-wrap:wrap;">'
      + '<button class="btn btn-primary" data-act="renew">续存本行</button>'
      + '<button class="btn btn-primary" data-act="transfer">转存他行</button>'
      + '<button class="btn btn-ghost" data-act="out">取出完成</button>'
      + '<button class="btn btn-ghost" data-act="edit">编辑</button></div>';
  }else if(st === 'holding'){
    actions = '<div class="sheet-actions" style="flex-wrap:wrap;">'
      + '<button class="btn btn-primary" data-act="renew">续存本行</button>'
      + '<button class="btn btn-primary" data-act="transfer">转存他行</button>'
      + '<button class="btn btn-ghost" data-act="edit">编辑</button>'
      + '<button class="btn btn-primary" data-act="out">取出</button></div>';
  }else{
    actions = '<div class="sheet-actions"><button class="btn btn-ghost" data-act="edit">查看/编辑</button></div>';
  }
  openSheet(
    '<div class="sheet-head"><b>存单详情</b><button class="sheet-x" data-x>✕</button></div>'
    + '<div class="dep-card' + (st === 'pending' ? ' pending' : '') + '" style="margin-bottom:12px;">'
      + '<div class="dep-top"><div class="dep-bank">🏦 ' + esc(d.bank) + '<span class="dep-type">' + termLabel(d) + '</span></div>'
      + '<span style="font-size:12px;font-weight:700;">' + DEP_STATUS_TXT[st] + '</span></div>'
      + '<div class="dep-amt">' + fmtMoney(d.amount) + '</div></div>'
    + '<div class="chain">'
      + '<div class="info-row"><span class="k">卡号</span><span class="v" id="cardNo" style="cursor:pointer">' + maskCard(d.card) + '</span></div>'
      + '<div class="info-row"><span class="k">存入日期</span><span class="v">' + (d.depositDate || '—') + '</span></div>'
      + (d.type === '定期' ? '<div class="info-row"><span class="k">' + termLabel(d) + ' · 到期日</span><span class="v">' + (d.maturityDate || '—') + '</span></div>' : '')
      + (st === 'done' ? '<div class="info-row"><span class="k">实际取出日</span><span class="v">' + (d.actualOutDate || '—') + '</span></div>' : '')
      + (d.note ? '<div class="info-row"><span class="k">备注</span><span class="v">' + esc(d.note) + '</span></div>' : '')
      + '</div>'
    + (chainHTML || '')
    + (st === 'pending' ? '<div class="mini-note">这笔存款已到期：可以直接取出，或一键续存 / 转到其他银行，原存单会自动完成归档。</div>' : '')
    + (st === 'holding' && d.type === '定期' ? '<div class="mini-note">还没到期也可以提前续存 / 转存：新存单将从今天开始计算，原存单自动完成归档。</div>' : '')
    + actions
  );
  $$('#sheet [data-x]').forEach(b => b.onclick = closeSheet);
  const cardEl = $('#cardNo');
  if(cardEl) cardEl.onclick = () => { cardEl.textContent = cardEl.textContent.includes('•') ? (d.card || '未填写') : maskCard(d.card); };
  $$('#sheet [data-act]').forEach(b => b.onclick = async () => {
    const act = b.dataset.act;
    if(act === 'edit'){ openDepForm(d); return; }
    if(act === 'out'){
      if(await confirmDlg('确定标记为「已取出」吗？<br>取出日期将记为今天（' + todayStr() + '）', '取出', true)){
        d.completed = true; d.actualOutDate = todayStr();
        await dbPut('deposits', d);
        closeSheet(); renderAll(); toast('已完成 ✓');
      }
      return;
    }
    if(act === 'renew' || act === 'transfer'){
      const matured = st === 'pending';
      openDepForm(null, {
        rollover: act,
        parent: d,
        title: act === 'renew' ? '续存（本行）' : '转存（其他银行）',
        bank: act === 'renew' ? d.bank : '',
        card: act === 'renew' ? d.card : '',
        amount: d.amount,
        date: matured ? (d.maturityDate || todayStr()) : todayStr(),
      });
    }
  });
}

function openDepForm(existing, opts){
  opts = opts || {};
  const d = existing || {
    id: uid(), bank: opts.bank || '', card: opts.card || '', amount: opts.amount != null ? opts.amount : null,
    depositDate: opts.date || todayStr(), type: '定期', termMonths: 12,
    termValue: 12, termUnit: 'm',
    maturityDate: null, completed: false, note: '', parentId: opts.parent ? opts.parent.id : null,
    createdAt: Date.now(), updatedAt: Date.now()
  };
  normalizeDep(d);
  const title = existing ? '编辑存单' : (opts.title || '新建存单');
  const isPreset = d.termUnit === 'm' && TERMS.some(t => t.m === d.termValue);
  const termOpts = TERMS.map(t => '<option value="' + t.m + '"' + (isPreset && d.termValue === t.m ? ' selected' : '') + '>' + t.label + '</option>').join('')
    + '<option value="custom"' + (isPreset ? '' : ' selected') + '>自定义…</option>';
  openSheet(
    '<div class="sheet-head"><b>' + title + '</b><button class="sheet-x" data-x>✕</button></div>'
    + '<div class="field"><label>银行</label><input type="text" id="dBank" placeholder="如：工商银行" value="' + esc(d.bank) + '"></div>'
    + '<div class="field"><label>卡号（可选）</label><input type="text" inputmode="numeric" id="dCard" placeholder="存储卡号" value="' + esc(d.card) + '"></div>'
    + '<div class="field"><label>存款金额</label><div class="money-wrap"><input type="number" inputmode="decimal" step="0.01" id="dAmt" placeholder="0.00" value="' + (d.amount == null ? '' : d.amount) + '"></div></div>'
    + '<div class="field"><label>存入日期</label><input type="date" id="dDate" value="' + (d.depositDate || todayStr()) + '"></div>'
    + '<div class="field"><label>类型</label><div class="chips" id="dType">'
      + '<button class="chip' + (d.type === '活期' ? ' on' : '') + '" data-t="活期">活期</button>'
      + '<button class="chip' + (d.type === '定期' ? ' on' : '') + '" data-t="定期">定期</button></div></div>'
    + '<div class="field" id="dTermRow" style="display:' + (d.type === '定期' ? 'block' : 'none') + ';"><label>存期</label>'
      + '<select id="dTerm">' + termOpts + '</select></div>'
    + '<div id="dCustomRow" style="display:' + (d.type === '定期' && !isPreset ? 'block' : 'none') + ';">'
      + '<div class="field" style="display:flex;gap:8px;">'
        + '<input type="number" inputmode="numeric" id="dCustVal" placeholder="数量" min="1" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);" value="' + (isPreset ? '' : d.termValue) + '">'
        + '<select id="dCustUnit" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);">'
          + '<option value="d"' + (d.termUnit === 'd' ? ' selected' : '') + '>天</option>'
          + '<option value="m"' + (d.termUnit === 'm' ? ' selected' : '') + '>月</option>'
          + '<option value="y"' + (d.termUnit === 'y' ? ' selected' : '') + '>年</option>'
        + '</select>'
      + '</div></div>'
    + '<div class="field"><label>备注（可选）</label><input type="text" id="dNote" placeholder="如：给装修攒的钱…" value="' + esc(d.note || '') + '"></div>'
    + '<div class="mini-note" id="dMature"></div>'
    + (existing ? '<div class="sheet-actions"><button class="btn-danger" data-del>删除</button></div>' : '')
    + '<div class="sheet-actions"><button class="btn btn-ghost" data-x>取消</button><button class="btn btn-primary" data-save>保存</button></div>'
  );
  const updMature = () => {
    const el = $('#dMature');
    if(d.type === '定期'){
      const t = effTerm();
      if(!t || !t.v || isNaN(t.v) || t.v <= 0){ el.textContent = '请输入自定义存期数量'; return; }
      const tmp = { termValue: t.v, termUnit: t.u };
      const m = maturityFrom(tmp, $('#dDate').value);
      el.textContent = m ? '📅 到期日自动计算：' + m : '';
    }else{
      el.textContent = '活期存款没有固定到期日，可随时取出。';
    }
  };
  const effTerm = () => {
    if($('#dTerm').value === 'custom') return { v: parseFloat($('#dCustVal').value), u: $('#dCustUnit').value };
    return { v: +$('#dTerm').value, u: 'm' };
  };
  $$('#dType .chip').forEach(c => c.onclick = () => {
    d.type = c.dataset.t;
    $$('#dType .chip').forEach(x => x.classList.toggle('on', x.dataset.t === d.type));
    $('#dTermRow').style.display = d.type === '定期' ? 'block' : 'none';
    $('#dCustomRow').style.display = (d.type === '定期' && $('#dTerm').value === 'custom') ? 'block' : 'none';
    updMature();
  });
  $('#dTerm').addEventListener('change', () => {
    $('#dCustomRow').style.display = $('#dTerm').value === 'custom' ? 'block' : 'none';
    if($('#dTerm').value !== 'custom' && !$('#dCustVal').value) $('#dCustVal').value = $('#dTerm').value;
    updMature();
  });
  $('#dCustVal').addEventListener('input', updMature);
  $('#dCustUnit').addEventListener('change', updMature);
  $('#dDate').addEventListener('change', updMature);
  updMature();
  $$('#sheet [data-x]').forEach(b => b.onclick = closeSheet);
  if(existing){
    const delBtn = $('#sheet [data-del]');
    if(delBtn) delBtn.onclick = async () => {
      if(await confirmDlg('确定删除这张存单吗？', '删除')){
        await removeRecord('deposits', d.id);
        closeSheet(); renderAll(); toast('已删除');
      }
    };
  }
  $('#sheet [data-save]').onclick = async () => {
    const bank = $('#dBank').value.trim();
    const amt = $('#dAmt').value === '' ? null : parseFloat($('#dAmt').value);
    if(!bank){ toast('请填写银行名称'); return; }
    if(amt == null || isNaN(amt) || amt <= 0){ toast('请填写正确的存款金额'); return; }
    d.bank = bank;
    d.card = $('#dCard').value.trim();
    d.amount = amt;
    d.depositDate = $('#dDate').value || todayStr();
    d.note = ($('#dNote').value || '').trim();
    d.type = d.type || '定期';
    if(d.type === '定期'){
      const t = effTerm();
      if(!t || !t.v || isNaN(t.v) || t.v <= 0){ toast('请填写正确的自定义存期'); return; }
      d.termValue = t.v; d.termUnit = t.u;
      if(t.u === 'm') d.termMonths = t.v; else delete d.termMonths;
      d.maturityDate = maturityFrom(d, d.depositDate);
    }else{
      d.maturityDate = null;
    }
    d.updatedAt = Date.now();
    if(!existing){
      state.deposits.push(d);
    }
    if(opts.parent){
      const p = opts.parent;
      const wasPending = depStatus(p) === 'pending';
      p.completed = true;
      p.actualOutDate = wasPending ? (p.maturityDate || todayStr()) : todayStr();
      await dbPut('deposits', p);
    }
    await dbPut('deposits', d);
    closeSheet(); renderAll();
    toast(opts.parent ? '已转存，原存单自动完成 ✓' : '已保存 ✓');
  };
}

/* ================= profile page ================= */
const AVATAR_PRESETS = [
  { dog:'sit' }, { dog:'highfive' }, { dog:'sleep' }, { dog:'frisbee' }, { dog:'lying' },
  { emoji:'🐱', bg:'#ffe9d6' }, { emoji:'🐶', bg:'#e3edff' }, { emoji:'🦊', bg:'#ffeadb' },
  { emoji:'🐼', bg:'#eef2f5' }, { emoji:'🌸', bg:'#ffe6ef' }, { emoji:'⭐️', bg:'#fff6d9' },
  { emoji:'🍀', bg:'#e3f6e8' }, { emoji:'🌈', bg:'#f0e9ff' },
];
function avatarHTML(p, cls){
  const a = p.avatar;
  if(a && a.img) return '<div class="' + cls + '"><img src="' + a.img + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" alt=""></div>';
  if(a && a.dog && DOGS[a.dog]) return '<div class="' + cls + '"><img src="' + DOGS[a.dog] + '" alt=""></div>';
  if(a && a.emoji) return '<div class="' + cls + '" style="background:' + a.bg + '">' + a.emoji + '</div>';
  return '<div class="' + cls + '"><img src="' + DOGS.sit + '" alt=""></div>';
}
function renderMe(){
  const el = $('#page-me');
  const p = state.profile;
  el.innerHTML =
    '<div class="me-card">' + avatarHTML(p, 'avatar-lg') 
    + '<div style="flex:1;min-width:0;"><input class="nick-input" id="nickInput" placeholder="点击设置昵称" value="' + esc(p.nickname || '') + '" maxlength="20">'
    + '<div style="font-size:12px;color:var(--sub);margin-top:2px;">点击头像可更换</div></div></div>'
    + '<div class="me-group">'
      + '<button class="me-row" id="btnExport" style="width:100%;">📦 导出备份文件<span class="arr">›</span></button>'
      + '<button class="me-row" id="btnImport" style="width:100%;">📥 从备份恢复<span class="arr">›</span></button>'
    + '</div>'
    + '<div class="me-group">'
      + '<button class="me-row danger" id="btnClear" style="width:100%;">🗑 清空所有数据<span class="arr">›</span></button>'
    + '</div>'
    + '<div class="me-note">🔒 所有数据只保存在这台设备的浏览器里，不会上传到任何服务器。<br>💡 建议定期「导出备份」保存到手机；浏览器菜单 →「安装应用 / 添加到主屏幕」即可像 App 一样点开使用。<br>清除浏览器数据会删除记录，请先备份。</div>';
  $('#nickInput').addEventListener('input', () => { p.nickname = $('#nickInput').value; saveSoon('kv', p); });
  $('#nickInput').addEventListener('input', updateTopbar);
  $('.avatar-lg').onclick = openAvatarSheet;
  $('#btnExport').onclick = exportData;
  $('#btnImport').onclick = () => importData();
  $('#btnClear').onclick = clearAll;
}
function openAvatarSheet(){
  const grid = AVATAR_PRESETS.map((a, i) =>
    a.dog
      ? '<button data-av="' + i + '" style="width:52px;height:52px;border-radius:50%;overflow:hidden;background:#fff;border:1px solid var(--line);"><img src="' + DOGS[a.dog] + '" style="width:100%;height:100%;object-fit:cover;display:block;"></button>'
      : '<button data-av="' + i + '" style="width:52px;height:52px;border-radius:50%;font-size:26px;background:' + a.bg + ';">' + a.emoji + '</button>').join('');
  openSheet(
    '<div class="sheet-head"><b>选择头像</b><button class="sheet-x" data-x>✕</button></div>'
    + '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;">' + grid + '</div>'
    + '<button class="btn btn-ghost" id="avUpload" style="width:100%;">🖼 从相册选择图片</button>'
  );
  $$('#sheet [data-x]').forEach(b => b.onclick = closeSheet);
  $$('#sheet [data-av]').forEach(b => b.onclick = async () => {
    state.profile.avatar = Object.assign({}, AVATAR_PRESETS[+b.dataset.av]);
    await dbPut('kv', state.profile);
    closeSheet(); renderMe(); updateTopbar(); toast('头像已更新 ✓');
  });
  $('#avUpload').onclick = () => pickImage(async src => {
    state.profile.avatar = { img: src };
    await dbPut('kv', state.profile);
    closeSheet(); renderMe(); updateTopbar(); toast('头像已更新 ✓');
  }, 512, 0.85);
}

function exportData(){
  const payload = {
    app: '口袋记账本', version: 1, exportedAt: new Date().toISOString(),
    meals: state.meals, expenses: state.expenses, deposits: state.deposits,
    categories: state.categories, profile: state.profile
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '记账备份-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('备份文件已导出 📦');
}
function importData(){
  const fp = $('#filePick');
  fp.accept = '.json,application/json';
  fp.value = '';
  fp.onchange = async () => {
    const f = fp.files && fp.files[0];
    fp.accept = 'image/*';
    if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(!data || !Array.isArray(data.meals)) throw new Error('bad');
      const ok = await confirmDlg('导入备份将<b>覆盖当前所有数据</b>，确定继续吗？', '覆盖导入');
      if(!ok) return;
      state.meals = data.meals || [];
      state.expenses = data.expenses || [];
      state.deposits = data.deposits || [];
      state.categories = data.categories || [];
      if(data.profile) state.profile = Object.assign({ id:'profile' }, data.profile);
      normalizeAllDeps();
      for(const s of ['meals','expenses','deposits','categories']) await dbClear(s);
      for(const rec of state.meals) await dbPut('meals', rec);
      for(const rec of state.expenses) await dbPut('expenses', rec);
      for(const rec of state.deposits) await dbPut('deposits', rec);
      for(const rec of state.categories) await dbPut('categories', rec);
      await assignCategoryColors();
      await dbPut('kv', state.profile);
      renderAll(); toast('备份已恢复 ✓');
    }catch(e){
      fp.accept = 'image/*';
      toast('备份文件格式不对，导入失败');
    }
  };
  fp.click();
}
async function clearAll(){
  const ok = await confirmDlg('确定要<b>清空所有记录</b>吗？<br>此操作不可恢复，建议先导出备份！', '全部清空');
  if(!ok) return;
  for(const s of ['meals','expenses','deposits','categories']){ await dbClear(s); state[s] = []; }
  state.profile = { id:'profile', nickname:'', avatar:null };
  await dbClear('kv');
  await seedCategories();
  await assignCategoryColors();
  renderAll(); toast('已清空');
}

/* ================= tabs & fab ================= */
const FABS = {
  diet: { text:'记一餐', fn: newMeal },
  exp:  { text:'记一笔', fn: newExp },
  dep:  { text:'新建存单', fn: () => openDepForm(null) },
};
function switchTab(name){
  ui.tab = name;
  $$('.tab-btn').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  $$('.page').forEach(p => p.classList.remove('active'));
  $('#page-' + name).classList.add('active');
  const f = FABS[name];
  $('#fab').classList.toggle('hidden', !f);
  if(f) $('#fabText').textContent = f.text;
  window.scrollTo(0, 0);
}
$$('#tabbar .tab-btn').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$('#fab').onclick = () => { const f = FABS[ui.tab]; if(f) f.fn(); };
$('#meBtn').onclick = () => switchTab('me');

/* ================= topbar（欢迎区 & 搜索） ================= */
function updateTopbar(){
  const h = new Date().getHours();
  const hello = h < 5 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  $('#greetTxt').textContent = hello + (state.profile.nickname ? '，' + state.profile.nickname : '');
  const t = new Date();
  $('#dateTxt').textContent = (t.getMonth() + 1) + '月' + t.getDate() + '日 · 周' + WEEK[t.getDay()];
  $('#topAvatar').innerHTML = avatarHTML(state.profile, 'avatar-sm');
}
function openSearch(){
  const months = [...new Set([
    ...state.meals.map(m => m.date.slice(0, 7)),
    ...state.expenses.map(e => e.date.slice(0, 7))
  ])].sort().reverse();
  const monthOpts = '<option value="all">全部月份</option>' + months.map(m =>
    '<option value="' + m + '">' + m.split('-')[0] + '年' + (+m.split('-')[1]) + '月</option>').join('');
  const catOpts = '<option value="all">全部分类</option>' + state.categories.map(c =>
    '<option value="' + esc(c.name) + '">' + esc(c.name) + '</option>').join('');
  openSheet(
    '<div class="sheet-head"><b>🔍 搜索记录</b><button class="sheet-x" data-x>✕</button></div>'
    + '<div class="field"><input type="text" id="sq" placeholder="关键词：内容 / 备注 / 分类"></div>'
    + '<div class="field" style="display:flex;gap:8px;">'
      + '<select id="sMonth" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);">' + monthOpts + '</select>'
      + '<select id="sCat" style="flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);">' + catOpts + '</select>'
    + '</div>'
    + '<div class="list" id="sResults"></div>'
  );
  $$('#sheet [data-x]').forEach(b => b.onclick = closeSheet);
  const run = () => {
    const items = searchRecords($('#sq').value, $('#sMonth').value, $('#sCat').value);
    $('#sResults').innerHTML = items.map(it => {
      const emoji = it.kind === 'meal' ? (MEAL_EMOJI[it.mealType] || '🍽️') : (CAT_EMOJI[it.category] || '🏷️');
      return '<div class="row" data-kind="' + it.kind + '" data-id="' + it.id + '">'
        + '<div class="thumb">' + emoji + '</div>'
        + '<div class="row-main"><div class="row-title"><span class="cat-chip" style="background:' + catTint(it.category) + ';color:' + catInk(it.category) + '">' + esc(it.category) + '</span>'
        + '<span style="font-size:12px;color:var(--sub)">' + it.date.slice(5).replace('-', '/') + '</span></div>'
        + '<div class="row-sub">' + (esc(it.desc) || '未填写内容') + '</div>'
        + (it.note ? '<div class="row-note">📝 ' + esc(it.note) + '</div>' : '')
        + '</div>'
        + '<div class="row-cost">' + fmtMoney(it.cost) + '</div></div>';
    }).join('') || '<div class="empty-box"><span class="em">🐾</span>没有找到匹配的记录</div>';
    $$('#sResults .row').forEach(r => r.onclick = () => {
      closeSheet();
      setTimeout(() => {
        if(r.dataset.kind === 'meal'){ const m = state.meals.find(x => x.id === r.dataset.id); if(m) openMealEditor(m); }
        else { const e2 = state.expenses.find(x => x.id === r.dataset.id); if(e2) openExpEditor(e2); }
      }, 250);
    });
  };
  $('#sq').addEventListener('input', run);
  $('#sMonth').addEventListener('change', run);
  $('#sCat').addEventListener('change', run);
  run();
}
function searchRecords(kw, mKey, cat){
  const kwL = (kw || '').trim().toLowerCase();
  let items = [];
  state.meals.forEach(m => items.push({ kind:'meal', id:m.id, date:m.date, category:'饮食', mealType:m.mealType, desc:m.desc, note:m.note, cost:m.cost }));
  state.expenses.forEach(e => items.push({ kind:'exp', id:e.id, date:e.date, category:e.category, desc:e.desc, note:e.note, cost:e.cost }));
  if(mKey !== 'all') items = items.filter(i => i.date.startsWith(mKey));
  if(cat !== 'all') items = items.filter(i => i.category === cat);
  if(kwL) items = items.filter(i => ((i.desc || '') + ' ' + (i.note || '') + ' ' + i.category + ' ' + (i.mealType || '')).toLowerCase().includes(kwL));
  return items.sort((a,b) => b.date.localeCompare(a.date));
}
$('#searchBtn').onclick = openSearch;

/* ================= render all & init ================= */
function renderAll(){
  renderDiet();
  renderExp();
  renderStats();
  renderDep();
  renderMe();
}
async function seedCategories(){
  if(!state.categories.length){
    state.categories = BASE_CATS.map(n => ({ id: uid(), name:n, custom:false }));
    for(const c of state.categories) await dbPut('categories', c);
  }
}
async function init(){
  try{ idb = await idbOpen(); }catch(e){ idb = null; }
  state.meals = await dbAll('meals');
  state.expenses = await dbAll('expenses');
  state.deposits = await dbAll('deposits');
  state.categories = await dbAll('categories');
  const prof = await dbAll('kv');
  const p = prof.find(x => x.id === 'profile');
  if(p) state.profile = p;
  normalizeAllDeps();
  await seedCategories();
  await assignCategoryColors();
  // 清理打开编辑器后未填写就离开的空草稿
  for(const m of state.meals.filter(isEmptyMeal)) await removeRecord('meals', m.id);
  for(const e of state.expenses.filter(x => !x.desc && !x.photo && x.cost == null)) await removeRecord('expenses', x.id);
  renderAll();
  updateTopbar();
  switchTab('diet');
}
init();
</script>
